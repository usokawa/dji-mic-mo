<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dji-mic-mo</title>
<style>
:root {
  color-scheme: light dark;
  --motion: 0.2s cubic-bezier(0.4, 0.0, 0.2, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
}

button, input {
  font: inherit;
}

body {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin: 0.5rem;
  font-family: system-ui, sans-serif;
  color: CanvasText;
  background-color: Canvas;
}

fieldset {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding: 0.5rem;
  border: 1px solid ButtonBorder;
  border-radius: 0.5rem;

  > fieldset {
    align-items: flex-start;
    padding: 0.5rem;
  }

  > div {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
}

legend {
  padding: 0;
}

button {
  padding-block: 0.25rem;
  padding-inline: 0.5rem;
  color: ButtonText;
  background-color: ButtonFace;
  border: 1px solid ButtonBorder;
  border-radius: 0.25rem;
  transition: opacity var(--motion);
}

label {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

input[type="checkbox"] {
  position: relative;
  box-sizing: content-box;
  flex-shrink: 0;
  inline-size: 2em;
  block-size: 1em;
  appearance: none;
  background-color: ButtonBorder;
  border: 1px solid transparent;
  border-radius: 1em;
  transition: opacity var(--motion);

  &::before {
    content: "";
    position: absolute;
    inset-block-start: 0.1em;
    inset-inline-start: 0.1em;
    inline-size: 0.8em;
    block-size: 0.8em;
    background-color: Canvas;
    border-radius: 50%;
    transition: inset-inline-start var(--motion);
  }

  &:checked {
    background-color: LinkText;

    &::before {
      inset-inline-start: 1.1em;
    }
  }
}

input[type="range"] {
  accent-color: LinkText;
}

:is(button, input):focus-visible {
  outline: 2px solid LinkText;
  outline-offset: 2px;
}

:is(button, input):not(:disabled):hover {
  opacity: 0.5;
}

:is(button, input, textarea):disabled {
  color: GrayText;
  background-color: ButtonFace;
  border-color: GrayText;
  cursor: not-allowed;
}

#cfgGrp {
  > fieldset:not(:has(input:enabled)) {
    display: none;
  }

  > fieldset > div:has(input:disabled) {
    display: none;
  }
}

:is(#cfgTxt, #stateTxt) {
  inline-size: 100%;
  margin: 0;
  padding: 0.5rem;
  font-family: ui-monospace, monospace;
  font-size: 1rem;
  color: CanvasText;
  background-color: Canvas;
  border: 1px solid ButtonBorder;
  border-radius: 0.25rem;
}

#cfgTxt {
  display: block;
  field-sizing: content;
  resize: none;

  &:focus-visible {
    outline: 2px solid LinkText;
    outline-offset: -1px;
  }
}

#stateTxt {
  overflow-inline: auto;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    transition-delay: 0s !important;
  }
}

@media (forced-colors: active) {
  input[type="checkbox"] {
    background-color: Canvas;
    border-color: CanvasText;
    forced-color-adjust: none;

    &::before {
      background-color: CanvasText;
      forced-color-adjust: none;
    }

    &:checked {
      background-color: Highlight;
      border-color: Highlight;

      &::before {
        background-color: HighlightText;
      }
    }
  }

  input[type="range"] {
    accent-color: Highlight;
  }

  :is(button, input):focus-visible {
    outline-color: Highlight;
  }
}
</style>
</head>
<body>
<fieldset id="connGrp">
  <legend>Connection</legend>
  <div>
    <button id="connBtn" type="button">Connect</button>
    <div><label><input id="debugChk" type="checkbox"> Debug</label></div>
  </div>
</fieldset>
<fieldset id="cfgGrp">
  <legend>Config</legend>
  <fieldset>
    <legend>RX</legend>
    <div><label><input name="rx.stereo" type="checkbox"> Stereo</label></div>
    <div><label><input name="rx.safetyTrack" type="checkbox"> Safety Track</label></div>
    <div>
      <label for="rx-gainControl">Gain Control (dB)</label>
      <input id="rx-gainControl" name="rx.gainControl" type="range" min="-12" max="12" step="6" value="0">
      <output for="rx-gainControl">0</output>
    </div>
    <div>
      <label for="rx-monitoringGain">Monitoring Gain (dB)</label>
      <input id="rx-monitoringGain" name="rx.monitoringGain" type="range" min="-12" max="12" step="1" value="0">
      <output for="rx-monitoringGain">0</output>
    </div>
    <div><label><input name="rx.clippingControl" type="checkbox"> Clipping Control</label></div>
    <div><label><input name="rx.autoOff" type="checkbox"> Auto Off</label></div>
    <div><label><input name="rx.receiverOnOffWithCamera" type="checkbox"> Receiver On/Off With Camera</label></div>
    <div><label><input name="rx.plugFreeExternalSpeaker" type="checkbox"> Plug-Free External Speaker (Restart required)</label></div>
  </fieldset>
  <fieldset>
    <legend>TX</legend>
    <div><label><input name="tx.noiseCancellation" type="checkbox"> Noise Cancellation</label></div>
    <div><label><input name="tx.noiseCancellationStrong" type="checkbox"> Noise Cancellation: Strong</label></div>
    <div><label><input name="tx.noiseCancellationViaButton" type="checkbox"> Noise Cancellation via Button</label></div>
    <div><label><input name="tx.lowCut" type="checkbox"> Low Cut</label></div>
    <div><label><input name="tx.clippingControl" type="checkbox"> Adaptive Gain Control: Clipping Control</label></div>
    <div><label><input name="tx.loudnessBalance" type="checkbox"> Adaptive Gain Control: Loudness Balance</label></div>
    <div><label><input name="tx.autoOff" type="checkbox"> Auto Off</label></div>
    <div><label><input name="tx.micLedOff" type="checkbox"> Mic LED Off</label></div>
  </fieldset>
  <fieldset>
    <legend>TX1</legend>
    <div><label><input name="tx1.rec" type="checkbox"> REC</label></div>
    <div>
      <label for="tx1-transmitterGain">Transmitter Gain (dB)</label>
      <input id="tx1-transmitterGain" name="tx1.transmitterGain" type="range" min="-12" max="12" step="1" value="0">
      <output for="tx1-transmitterGain">0</output>
    </div>
    <div><label><input name="tx1.voiceToneRich" type="checkbox"> Voice Tone: Rich</label></div>
    <div><label><input name="tx1.voiceToneBright" type="checkbox"> Voice Tone: Bright</label></div>
    <div><label><input name="tx1.fileOptionEditedFile" type="checkbox"> File Option: Edited File</label></div>
    <div><label><input name="tx1.float32Recording" type="checkbox"> 32-bit Float Recording</label></div>
    <div><label><input name="tx1.startupAutoRecording" type="checkbox"> Startup Auto Recording</label></div>
    <div><label><input name="tx1.loopRecording" type="checkbox"> Loop Recording</label></div>
    <div><label><input name="tx1.recStop" type="checkbox"> REC Stop</label></div>
    <div><label><input name="tx1.vibration" type="checkbox"> Vibration</label></div>
  </fieldset>
  <fieldset>
    <legend>TX2</legend>
    <div><label><input name="tx2.rec" type="checkbox"> REC</label></div>
    <div>
      <label for="tx2-transmitterGain">Transmitter Gain (dB)</label>
      <input id="tx2-transmitterGain" name="tx2.transmitterGain" type="range" min="-12" max="12" step="1" value="0">
      <output for="tx2-transmitterGain">0</output>
    </div>
    <div><label><input name="tx2.voiceToneRich" type="checkbox"> Voice Tone: Rich</label></div>
    <div><label><input name="tx2.voiceToneBright" type="checkbox"> Voice Tone: Bright</label></div>
    <div><label><input name="tx2.fileOptionEditedFile" type="checkbox"> File Option: Edited File</label></div>
    <div><label><input name="tx2.float32Recording" type="checkbox"> 32-bit Float Recording</label></div>
    <div><label><input name="tx2.startupAutoRecording" type="checkbox"> Startup Auto Recording</label></div>
    <div><label><input name="tx2.loopRecording" type="checkbox"> Loop Recording</label></div>
    <div><label><input name="tx2.recStop" type="checkbox"> REC Stop</label></div>
    <div><label><input name="tx2.vibration" type="checkbox"> Vibration</label></div>
  </fieldset>
</fieldset>
<fieldset id="jsonGrp">
  <legend>Config (JSON)</legend>
  <div><textarea id="cfgTxt" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"></textarea></div>
  <div><button id="applyBtn" type="button">Apply</button></div>
</fieldset>
<fieldset id="stateGrp">
  <legend>State</legend>
  <pre id="stateTxt"></pre>
</fieldset>

<script type="module">
const connBtn = document.getElementById('connBtn');
const debugChk = document.getElementById('debugChk');
const cfgGrp = document.getElementById('cfgGrp');
const cfgInputs = cfgGrp.querySelectorAll('input');
const applyBtn = document.getElementById('applyBtn');
const cfgTxt = document.getElementById('cfgTxt');
const stateTxt = document.getElementById('stateTxt');

const isObj = (v) => v?.constructor === Object;
const hex = (v, len = 2) => v.toString(16).padStart(len, '0');

const concat = (a, b) => {
  if (a.length === 0) { return b; }
  if (b.length === 0) { return a; }

  const c = new Uint8Array(a.length + b.length);
  c.set(a);
  c.set(b, a.length);
  return c;
};

const strDec = new TextDecoder();
const numFmt = new Intl.NumberFormat('en-US', { signDisplay: 'exceptZero' });

const ver = (buf, off) =>
  [...buf.subarray(off, off + 4)]
    .reverse()
    .map((b) => b.toString().padStart(2, '0'))
    .join('.');

const fstr = (sz) => (buf, off) => strDec.decode(buf.subarray(off, off + sz));
const vstr = (buf, off) => strDec.decode(buf.subarray(off, off + buf[off - 1]));
const f16 = (buf, off) => new DataView(buf.buffer, buf.byteOffset, buf.byteLength).getUint16(off, true) / 10;
const i8 = (buf, off) => new DataView(buf.buffer, buf.byteOffset, buf.byteLength).getInt8(off);
const u8 = (buf, off) => buf[off];
const bits = (shift, mask) => (buf, off) => (buf[off] >>> shift) & mask;
const bit = (mask) => (buf, off) => Boolean(buf[off] & mask);

const bl1 = (val) => val === true ? 1 : val === false ? 0 : null;
const bl2 = (val) => val === true ? 2 : val === false ? 0 : null;
const gain = (val) => [-12, -6, 0, 6, 12].includes(val) ? val & 0xff : null;
const gain1 = (val) => Number.isInteger(val) && val >= -12 && val <= 12 ? val & 0xff : null;

const [T8, T16] = (() => {
  const t8 = new Uint8Array(256);
  const t16 = new Uint16Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    let k = i;
    for (let j = 0; j < 8; j++) {
      c = (c >>> 1) ^ (-(c & 1) & 0x8c);
      k = (k >>> 1) ^ (-(k & 1) & 0x8408);
    }
    t8[i] = c;
    t16[i] = k;
  }
  return [t8, t16];
})();

function crc8(buf) {
  let c = 0x77;
  for (const b of buf) {
    c = T8[c ^ b];
  }
  return c;
}

function crc16(buf) {
  let c = 0x3692;
  for (const b of buf) {
    c = (c >>> 8) ^ T16[(c ^ b) & 0xff];
  }
  return c;
}

function dump(pkt) {
  const pview = new DataView(pkt.buffer, pkt.byteOffset, pkt.byteLength);
  const hdr = pview.getUint16(1, true);
  const pktVer = (hdr >>> 10) & 0x3f;
  const pktLen = hdr & 0x3ff;
  const pktSeq = pview.getUint16(6, true);
  const data = pkt.subarray(11, -2);

  const lines = [
    `Ver: ${pktVer} Len: ${pktLen}(${data.length}) ` +
    `Src: ${hex(pkt[4])} Dst: ${hex(pkt[5])} ` +
    `Seq: ${hex(pktSeq, 4)} Type: ${hex(pkt[8])} ` +
    `Set: ${hex(pkt[9])} ID: ${hex(pkt[10])}`,
  ];

  for (let i = 0; i < data.length; i += 16) {
    const chunk = [...data.subarray(i, i + 16)];
    const left = chunk.slice(0, 8).map((b) => hex(b)).join(' ');
    const right = chunk.slice(8).map((b) => hex(b)).join(' ');
    const hexStr = right ? `${left}  ${right}` : left;
    const asciiStr = chunk.map((b) => (32 <= b && b <= 126) ? String.fromCharCode(b) : '.').join('');
    lines.push(`${hex(i, 4)}  ${hexStr.padEnd(48, ' ')}  |${asciiStr}|`);
  }

  return lines.join('\n');
}

const ADDR = { rx: 0, tx1: 1 << 0, tx2: 1 << 1, tx: 0xffff };

const RULES = {
  rx: {
    firmwareVersion:         [0x01,  9, ver],
    serialNumber:            [0x01, 13, fstr(14)],
    addressSuffix:           [0x01, 33, fstr(6)],
    deviceName:              [0x01, 45, vstr],
    batteryLevel:            [0x03, 10, bits(5, 0x07), 'DJI Mic Mini'],
    charging:                [0x03, 10, bit(0x10), 'DJI Mic Mini'],
    stereo:                  [0x03, 10, bit(0x04), 0x08, bl2],
    safetyTrack:             [0x03, 37, bit(0x40), 0x21, bl1],
    gainControl:             [0x03, 11, i8,        0x39, gain, '+DJI Mic Mini 2'],
    monitoringGain:          [0x03, 16, i8,        0x26, gain1, 'DJI Mic Mini 2'],
    clippingControl:         [0x03, 37, bit(0x10), 0x1e, bl1],
    autoOff:                 [0x03, 10, bit(0x01), 0x10, bl1, 'DJI Mic Mini'],
    receiverOnOffWithCamera: [0x03,  9, bit(0x80), 0x20, bl1, 'DJI Mic Mini'],
    plugFreeExternalSpeaker: [0x03, 37, bit(0x02), 0x23, bl1],
  },
  tx: {
    noiseCancellation:          [0x03,  7, bit(0x01), 0x38, bl1, '+DJI Mic Mini'],
    noiseCancellationStrong:    [0x03,  6, bit(0x20), 0x37, bl1, '+DJI Mic Mini'],
    noiseCancellationViaButton: [0x03,  6, bit(0x80), 0x0f, bl1, 'DJI Mic Mini'],
    lowCut:                     [0x03,  9, bit(0x20), 0x03, bl1],
    clippingControl:            [0x03,  8, bit(0x04), 0x24, bl1],
    loudnessBalance:            [0x03, 11, bit(0x80), 0x2c, bl2],
    autoOff:                    [0x03,  6, bit(0x10), 0x10, bl1],
    micLedOff:                  [0x03,  6, bit(0x02), 0x0a, bl2],
  },
  txi: {
    firmwareVersion:         [0x01,  6, ver],
    serialNumber:            [0x01, 10, fstr(14)],
    addressSuffix:           [0x01, 30, fstr(6)],
    deviceName:              [0x01, 42, vstr],
    batteryLevel:            [0x03,  7, bits(2, 0x07)],
    charging:                [0x03,  7, bit(0x02)],
    inputLevel:              [0x05,  6, u8],
    rec:                     [0x03,  9, bit(0x10), 0x02, bl1, 'DJI Mic Mini 2S'],
    transmitterGain:         [0x03, 13, i8,        0x39, gain1, 'DJI Mic Mini 2S'],
    voiceToneRich:           [0x03,  9, bit(0x40), 0x29, bl1, '!DJI Mic Mini'],
    voiceToneBright:         [0x03,  9, bit(0x80), 0x29, bl2, '!DJI Mic Mini'],
    recordingTimeRemaining:  [0x03, 14, f16, 'DJI Mic Mini 2S'],
    recordingTimeTotal:      [0x03, 16, f16, 'DJI Mic Mini 2S'],
    fileOptionEditedFile:    [0x03, 31, bit(0x80), 0x3d, bl2, 'DJI Mic Mini 2S'],
    float32Recording:        [0x03,  9, bit(0x08), 0x0c, bl1, 'DJI Mic Mini 2S'],
    startupAutoRecording:    [0x03,  8, bit(0x80), 0x2e, bl1, 'DJI Mic Mini 2S'],
    loopRecording:           [0x03, 11, bit(0x08), 0x2a, bl1, 'DJI Mic Mini 2S'],
    recStop:                 [0x03, 11, bit(0x20), 0x0b, bl1, 'DJI Mic Mini 2S'],
    vibration:               [0x03,  9, bit(0x01), 0x04, bl1, 'DJI Mic Mini 2S'],
  },
};

let usbDev = null;
let state = null;
let seq = 0;
let debug = false;
const cfgQueue = [];
const txQueue = [];
let txWorker = null;

function toNode(node) {
  return ['tx1', 'tx2'].includes(node) ? 'txi' : node;
}

function valid(node, rule, write = false, typ = null, sz = null, base = null) {
  if (write) {
    if (rule.length < 5) { return false; }
  } else {
    if (rule[0] !== typ || base + rule[1] >= sz) { return false; }
  }

  const rName = rule.at(-1);
  if (typeof rName !== 'string') { return true; }
  if (!write && rName.startsWith('+')) { return true; }

  let nodeName = null;
  if (['rx', 'tx'].includes(node)) {
    nodeName = state.rx.deviceName;
  } else if (['tx1', 'tx2'].includes(node)) {
    nodeName = state[node].deviceName;
  }

  if (nodeName === null) { return false; }

  if (rName.startsWith('!')) {
    return nodeName !== rName.slice(1);
  }
  return nodeName === (rName.startsWith('+') ? rName.slice(1) : rName);
}

function scan(data) {
  const sz = data.length;
  if (sz < 4) { return { typ: null, rx: null, tx1: null, tx2: null }; }

  const blk = { typ: data[3], rx: null, tx1: null, tx2: null };

  if (blk.typ === 0x01 && sz >= 45) {
    blk.rx = 0;
    let i = 45 + data[44];
    while (i + 42 <= sz) {
      if (data[i] === 0x01 && [1, 2].includes(data[i + 1])) {
        blk[`tx${data[i + 1]}`] = i;
      }
      i += 42 + data[i + 41];
    }
    return blk;
  }

  if (blk.typ === 0x03 && sz >= 41) {
    blk.rx = 0;
    for (let i = 41; i < sz - 31; i += 32) {
      if (data[i] === 0x02 && [1, 2].includes(data[i + 1])) {
        blk[`tx${data[i + 1]}`] = i;
      }
    }
    return blk;
  }

  if (blk.typ === 0x05 && sz >= 10) {
    for (let i = 3; i < sz - 6; i += 7) {
      if (data[i] === 0x05 && [1, 2].includes(data[i + 1])) {
        blk[`tx${data[i + 1]}`] = i;
      }
    }
    return blk;
  }

  return blk;
}

function read(node, data, typ, base, obj) {
  for (const [key, rule] of Object.entries(RULES[toNode(node)])) {
    if (!valid(node, rule, false, typ, data.length, base)) { continue; }
    obj[key] = rule[2](data, base + rule[1]);
  }
}

function init(node) {
  return Object.fromEntries(Object.keys(RULES[node]).map((key) => [key, null]));
}

function parse(pkt) {
  if (pkt[9] !== 0x5b || pkt[10] !== 0x03) { return; }

  const data = pkt.subarray(11, -2);
  const blk = scan(data);

  if (blk.rx !== null) {
    read('rx', data, blk.typ, blk.rx, state.rx);
  }

  for (const n of [1, 2]) {
    const base = blk[`tx${n}`];
    if (base === null) {
      if (blk.typ === 0x01 || blk.typ === 0x03) {
        state[`tx${n}`] = null;
      }
      continue;
    }

    if (!state[`tx${n}`]) {
      state[`tx${n}`] = init('txi');
    }
    read(`tx${n}`, data, blk.typ, base, state[`tx${n}`]);
  }

  if (blk.tx1 === null && blk.tx2 === null) {
    if (blk.typ === 0x01 || blk.typ === 0x03) {
      state.tx = null;
    }
    return;
  }

  if (!state.tx) {
    state.tx = init('tx');
  }
  read('tx', data, blk.typ, blk.tx1 ?? blk.tx2, state.tx);
}

async function flush() {
  while (txQueue.length > 0) {
    if (!usbDev?.opened) {
      txQueue.length = 0;
      break;
    }
    const pkt = txQueue.shift();
    try {
      await usbDev.transferOut(6, pkt);
      if (debug) {
        console.log(`${dump(pkt)}\n`);
      }
      if (txQueue.length > 0) {
        await new Promise((resolve) => setTimeout(resolve, 10));
      }
    } catch {}
  }
  txWorker = null;
}

async function send(nodeAddr, cmd, val) {
  if (!usbDev) { return; }

  const pkt = new Uint8Array(22);
  const pview = new DataView(pkt.buffer);
  pkt[0] = 0x55;
  pkt.set([0x16, 0x04], 1);
  pkt[3] = crc8(pkt.subarray(0, 3));
  pkt.set([0x02, 0x5a], 4);
  pview.setUint16(6, seq, true);
  pkt.set([
    0x40, 0x5b, 0x01, 0x02, nodeAddr & 0xff, (nodeAddr >>> 8) & 0xff, 0x00, 0x00,
    cmd, 0x00, 0x01, val,
  ], 8);
  pview.setUint16(20, crc16(pkt.subarray(0, 20)), true);

  seq = (seq + 1) & 0xffff;

  txQueue.push(pkt);
  txWorker ??= flush();
  return txWorker;
}

async function sendTime() {
  if (!usbDev) { return; }

  const d = new Date();

  const pkt = new Uint8Array(29);
  const pview = new DataView(pkt.buffer);
  pkt[0] = 0x55;
  pkt.set([0x1d, 0x04], 1);
  pkt[3] = crc8(pkt.subarray(0, 3));
  pkt.set([0x02, 0x5a], 4);
  pview.setUint16(6, seq, true);
  pkt.set([
    0x40, 0x5b, 0x01, 0x02, 0x00, 0x00, 0x00, 0x00, 0x33, 0x00, 0x08, 0x09,
    d.getFullYear() % 100, d.getMonth() + 1, d.getDate(),
    d.getHours(), d.getMinutes(), d.getSeconds(), 0x00,
  ], 8);
  pview.setUint16(27, crc16(pkt.subarray(0, 27)), true);

  seq = (seq + 1) & 0xffff;

  txQueue.push(pkt);
  txWorker ??= flush();
  return txWorker;
}

const ctrl = new Proxy({}, {
  get(_, node) {
    if (!state[node]) { return state[node] ?? undefined; }

    return new Proxy(state[node], {
      set(obj, key, val) {
        if (!Object.hasOwn(obj, key) || obj[key] === val) { return true; }
        const rule = RULES[toNode(node)][key];
        if (!rule) { return true; }
        if (!valid(node, rule, true)) { return true; }
        const enc = rule[4](val);
        if (enc === null) { return true; }

        send(ADDR[node], rule[3], enc).catch(() => {});
        return true;
      }
    });
  }
});

function pick(node) {
  if (!state?.[node]) { return undefined; }
  const rules = RULES[toNode(node)];
  return Object.fromEntries(
    Object.entries(state[node]).filter(([key]) => rules[key] && valid(node, rules[key], true))
  );
}

function sync() {
  const cfg = { rx: pick('rx'), tx: pick('tx'), tx1: pick('tx1'), tx2: pick('tx2') };
  for (const el of cfgInputs) {
    const [node, key] = el.name.split('.');
    const val = cfg[node]?.[key];
    if (val === undefined || val === null) {
      el.disabled = true;
      continue;
    }
    el.disabled = false;
    if (el.type === 'checkbox') {
      el.checked = val;
      continue;
    }
    if (el.type !== 'range') { continue; }
    el.value = val;
    const out = el.nextElementSibling;
    if (!out) { continue; }
    out.value = numFmt.format(val);
  }
}

function apply() {
  if (!state?.rx.deviceName) { return; }

  if (cfgQueue.length > 0) {
    sendTime().catch(() => {});
  }

  while (cfgQueue.length > 0) {
    const cfg = cfgQueue.shift();
    if (!isObj(cfg)) { continue; }

    let spk;

    if (isObj(cfg.rx)) {
      const { plugFreeExternalSpeaker, ...cfgRx } = cfg.rx;
      spk = plugFreeExternalSpeaker;
      Object.assign(ctrl.rx, cfgRx);
    }

    if (ctrl.tx && isObj(cfg.tx)) {
      Object.assign(ctrl.tx, cfg.tx);
    }

    if (ctrl.tx1 && isObj(cfg.tx1)) {
      Object.assign(ctrl.tx1, cfg.tx1);
    }

    if (ctrl.tx2 && isObj(cfg.tx2)) {
      Object.assign(ctrl.tx2, cfg.tx2);
    }

    if (spk !== undefined) {
      ctrl.rx.plugFreeExternalSpeaker = spk;
    }
  }
}

async function* stream(dev) {
  let buf = new Uint8Array();
  while (dev.opened) {
    const res = await dev.transferIn(6, 1024);
    if (res.status !== 'ok' || res.data.byteLength === 0) { continue; }

    buf = concat(buf, new Uint8Array(res.data.buffer, res.data.byteOffset, res.data.byteLength));
    let off = 0;
    const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);

    while (off < buf.length) {
      const idx = buf.indexOf(0x55, off);
      if (idx < 0) {
        off = buf.length;
        break;
      }
      off = idx;

      if (buf.length - off < 4) { break; }
      if (crc8(buf.subarray(off, off + 3)) !== buf[off + 3]) {
        off += 1;
        continue;
      }

      const sz = view.getUint16(off + 1, true) & 0x3ff;
      if (sz < 13) {
        off += 1;
        continue;
      }
      if (sz > buf.length - off) { break; }

      const pkt = buf.subarray(off, off + sz);
      if (crc16(pkt.subarray(0, sz - 2)) !== view.getUint16(off + sz - 2, true)) {
        off += 1;
        continue;
      }
      off += sz;

      yield pkt;
    }

    buf = buf.slice(off);
  }
}

const prune = (_, val) => val === null ? undefined : val;

async function main() {
  try {
    usbDev = await navigator.usb.requestDevice({ filters: [{ vendorId: 0x2ca3, productId: 0x4011 }] });
    await usbDev.open();
    if (!usbDev.configuration) {
      await usbDev.selectConfiguration(1);
    }
    await usbDev.claimInterface(6);

    state = { rx: init('rx'), tx: null, tx1: null, tx2: null };
    seq = 0;
    cfgQueue.length = 0;
    txQueue.length = 0;
    txWorker = null;

    let last = '';
    let lastCfg = '';

    for await (const pkt of stream(usbDev)) {
      if (debug) {
        console.log(`${dump(pkt)}\n`);
      }

      parse(pkt);

      const currCfg = JSON.stringify(
        { rx: pick('rx'), tx: pick('tx'), tx1: pick('tx1'), tx2: pick('tx2') },
        prune,
        2,
      );
      if (currCfg !== lastCfg) {
        sync();
        applyBtn.disabled = !state.rx.deviceName;
        cfgTxt.disabled = !state.rx.deviceName;
        cfgTxt.value = currCfg;
        lastCfg = currCfg;
      }

      const curr = JSON.stringify(state, prune, 2);
      if (curr !== last) {
        stateTxt.textContent = curr;
        last = curr;
      }
    }
  } finally {
    state = null;
    seq = 0;

    txQueue.length = 0;
    if (txWorker) {
      try { await txWorker; } catch {}
    }
    txWorker = null;

    if (usbDev?.opened) {
      try { await usbDev.close(); } catch {}
    }
    usbDev = null;

    cfgQueue.length = 0;
  }
}

connBtn.addEventListener('click', async () => {
  connBtn.disabled = true;
  try {
    await main();
  } catch (e) {
    stateTxt.textContent = JSON.stringify({ e: e instanceof Error ? `${e.name}: ${e.message}` : String(e) }, null, 2);
  } finally {
    sync();
    applyBtn.disabled = true;
    cfgTxt.disabled = true;
    cfgTxt.value = '';
    connBtn.disabled = false;
  }
});

debugChk.addEventListener('change', (e) => { debug = e.target.checked; });

cfgGrp.addEventListener('input', (e) => {
  if (e.target.type !== 'range') { return; }

  const out = e.target.nextElementSibling;

  if (!out) { return; }

  out.value = numFmt.format(e.target.valueAsNumber);
});

cfgGrp.addEventListener('change', (e) => {
  const { name, type, checked, valueAsNumber } = e.target;
  if (!state?.rx.deviceName || !name) { return; }

  const [node, key] = name.split('.');

  if (!node || !key || !RULES[toNode(node)]?.[key]) { return; }

  const val = type === 'checkbox' ? checked : type === 'range' ? valueAsNumber : null;
  if (val === null) { return; }

  cfgQueue.push({ [node]: { [key]: val } });
  apply();
});

applyBtn.addEventListener('click', async () => {
  applyBtn.disabled = true;
  cfgTxt.disabled = true;

  try {
    const cfg = JSON.parse(cfgTxt.value);
    if (isObj(cfg)) {
      cfgQueue.push(cfg);
    }
  } catch {}

  apply();

  if (txWorker) {
    try { await txWorker; } catch {}
  }
  applyBtn.disabled = !state?.rx.deviceName;
  cfgTxt.disabled = !state?.rx.deviceName;
});

navigator.usb.addEventListener('disconnect', (e) => {
  if (e.device !== usbDev) { return; }
  try { usbDev.close(); } catch {}
});

sync();
applyBtn.disabled = true;
cfgTxt.disabled = true;
</script>
</body>
